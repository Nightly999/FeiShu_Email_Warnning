[project]
name = "feishu-langgraph-agent"
version = "0.1.0"
description = "Multi-tenant Feishu bot gateway backed by LangGraph and MCP tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "langgraph==0.6.4",
  "langchain-openai==0.3.30",
  "python-dotenv==1.1.1",
  "cryptography==45.0.6",
  "aiosqlite==0.21.0",
  "openpyxl==3.1.5",
  "lark-oapi>=1.6.9,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.12.8",
]

[project.scripts]
feishu-agent-bootstrap = "app.bootstrap:main"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
